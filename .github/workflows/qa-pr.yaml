name: 'Quality Assurance - Pull Request'

on:
    pull_request:
        types:
            - opened
            - reopened
            - edited
            - synchronize

jobs:
    qa-pull-request:
        name: 'Quality Assurance - Pull Request'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -
                name: 'Check PR title format'
                run: |
                    TITLE="${{ github.event.pull_request.title }}"
                    # Require format: [MONE-*] or [Mastery-*] prefix
                    if [[ ! "${TITLE}" =~ ^\[M(ONE|astery)-[0-9]+\] ]]; then
                        echo "::error::PR title must start with [MONE-*] or [Mastery-*] ticket reference."
                        exit 1
                    fi
            -
                name: 'Check PR is not targeting wrong branch'
                run: |
                    BASE="${{ github.event.pull_request.base.ref }}"
                    if [[ "${BASE}" != "main" && "${BASE}" != "master" && ! "${BASE}" =~ ^stable/ ]]; then
                        echo "::error::PR must target main, master, or a stable/* branch."
                        exit 1
                    fi

    check-qa:
        name: 'Quality Assurance'
        if: ${{ always() }}
        runs-on: ubuntu-latest
        needs:
            - qa-pull-request
        steps:
            -
                name: 'Check failure'
                id: check-failure
                if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
                run: echo 'Failed.' && exit 1;
            -
                name: 'Check success'
                if: ${{ steps.check-failure.outcome == 'skipped' }}
                run: echo 'Success.' && exit 0;
