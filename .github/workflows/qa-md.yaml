name: 'Quality Assurance - Markdown'

on:
    pull_request:
        paths:
            - '**.md'
            - '.markdownlint.yaml'
    schedule:
        -
            cron: '0 6 * * *'

jobs:
    qa-markdown:
        name: 'Quality Assurance - Markdown'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -
                name: 'Checkout'
                uses: 'actions/checkout@v4'
            -
                name: 'Install markdownlint'
                run: 'npm install -g markdownlint-cli@^0.32.2'
            -
                name: 'Run markdownlint'
                run: markdownlint .

    check-qa:
        name: 'Quality Assurance'
        if: ${{ always() }}
        runs-on: ubuntu-latest
        needs:
            - qa-markdown
        steps:
            -
                name: 'Check failure'
                id: check-failure
                if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
                run: echo 'Failed.' && exit 1;
            -
                name: 'Check success'
                if: ${{ steps.check-failure.outcome == 'skipped' }}
                run: echo 'Success.' && exit 0;
