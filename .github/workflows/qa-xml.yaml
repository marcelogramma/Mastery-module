name: 'Quality Assurance - XML'

on:
    pull_request:
        paths:
            - '**.xml'
    schedule:
        -
            cron: '0 6 * * *'

jobs:
    qa-xml:
        name: 'Quality Assurance - XML'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -
                name: 'Checkout'
                uses: 'actions/checkout@v4'
            -
                name: 'Install xmllint'
                run: sudo apt-get install -y libxml2-utils
            -
                name: 'Validate XML files'
                run: |
                    find . -name '*.xml' \
                        -not -path './.git/*' \
                        -not -path './.venv/*' \
                        -not -path './.cache/*' \
                        -not -path './.mypy_cache/*' \
                        | while read FILE; do
                            xmllint --noout "${FILE}" || exit 1
                        done

    check-qa:
        name: 'Quality Assurance'
        if: ${{ always() }}
        runs-on: ubuntu-latest
        needs:
            - qa-xml
        steps:
            -
                name: 'Check failure'
                id: check-failure
                if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
                run: echo 'Failed.' && exit 1;
            -
                name: 'Check success'
                if: ${{ steps.check-failure.outcome == 'skipped' }}
                run: echo 'Success.' && exit 0;
