name: 'Quality Assurance - Docker'

on:
    pull_request:
        paths:
            - '.docker/**'
            - '.dockerignore'
    schedule:
        -
            cron: '0 6 * * *'

jobs:
    qa-docker:
        name: 'Quality Assurance - Docker'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            -
                name: 'Checkout'
                uses: 'actions/checkout@v4'
            -
                name: 'Run Hadolint'
                uses: 'hadolint/hadolint-action@v3.1.0'
                with:
                    dockerfile: '.docker/app/Dockerfile'
                    config: '.docker/.hadolint.yaml'
            -
                name: 'Build Docker image'
                run: docker compose -f .docker/compose.yaml build cli
            -
                name: 'Install Trivy'
                run: |
                    sudo apt-get install -y wget apt-transport-https gnupg lsb-release
                    wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
                    echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
                    sudo apt-get update && sudo apt-get install -y trivy
            -
                name: 'Run Trivy scan'
                run: trivy config --config .docker/.trivy.yaml .docker/app/Dockerfile

    check-qa:
        name: 'Quality Assurance'
        if: ${{ always() }}
        runs-on: ubuntu-latest
        needs:
            - qa-docker
        steps:
            -
                name: 'Check failure'
                id: check-failure
                if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
                run: echo 'Failed.' && exit 1;
            -
                name: 'Check success'
                if: ${{ steps.check-failure.outcome == 'skipped' }}
                run: echo 'Success.' && exit 0;
