name: 'Quality Assurance - JSON'

on:
    pull_request:
        paths:
            - '**.json'
    schedule:
        -
            cron: '0 6 * * *'

jobs:
    qa-json:
        name: 'Quality Assurance - JSON'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            -
                name: 'Checkout'
                uses: 'actions/checkout@v4'
            -
                name: 'Install jsonlint'
                run: npm install -g jsonlint
            -
                name: 'Validate JSON files'
                run: |
                    find . -name '*.json' \
                        -not -path './.git/*' \
                        -not -path './node_modules/*' \
                        -not -path './.venv/*' \
                        -not -path './.cache/*' \
                        -not -path './.mypy_cache/*' \
                        | while read FILE; do
                            jsonlint --quiet "${FILE}" || exit 1
                        done

    check-qa:
        name: 'Quality Assurance'
        if: ${{ always() }}
        runs-on: ubuntu-latest
        needs:
            - qa-json
        steps:
            -
                name: 'Check failure'
                id: check-failure
                if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
                run: echo 'Failed.' && exit 1;
            -
                name: 'Check success'
                if: ${{ steps.check-failure.outcome == 'skipped' }}
                run: echo 'Success.' && exit 0;
