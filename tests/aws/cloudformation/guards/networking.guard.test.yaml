# Tests for `.aws/sam/guards/networking.guard`.

-
    name: PASS - Subnet with MapPublicIpOnLaunch false is compliant
    input:
        Resources:
            PrivateSubnet:
                Type: AWS::EC2::Subnet
                Properties:
                    VpcId: vpc-12345678
                    CidrBlock: 10.0.1.0/24
                    MapPublicIpOnLaunch: false
    expectations:
        rules:
            subnet_no_public_ip: PASS
            vpc_dns_enabled: SKIP
            security_group_rules_have_description: SKIP
            security_group_rule_resources_have_description: SKIP
            dms_replication_instance_not_publicly_accessible: SKIP
            vpc_interface_endpoint_private_dns_enabled: SKIP
            dms_endpoint_kms_encryption_required: SKIP

-
    name: FAIL - Subnet with MapPublicIpOnLaunch true is non-compliant
    input:
        Resources:
            PublicSubnet:
                Type: AWS::EC2::Subnet
                Properties:
                    VpcId: vpc-12345678
                    CidrBlock: 10.0.0.0/24
                    MapPublicIpOnLaunch: true
    expectations:
        rules:
            subnet_no_public_ip: FAIL
            vpc_dns_enabled: SKIP
