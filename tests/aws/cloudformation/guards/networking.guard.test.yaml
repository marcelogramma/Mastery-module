-
    name: PASS - Security group with described ingress and egress rules is compliant
    input:
        Resources:
            GlueSecurityGroup:
                Type: AWS::EC2::SecurityGroup
                Properties:
                    GroupDescription: Security group for Glue VPC connection
                    VpcId: vpc-12345678
                    SecurityGroupIngress:
                        -
                            IpProtocol: tcp
                            FromPort: 5439
                            ToPort: 5439
                            SourceSecurityGroupId: sg-abcdef01
                            Description: Allow Redshift access from Glue
                    SecurityGroupEgress:
                        -
                            IpProtocol: '-1'
                            CidrIp: 0.0.0.0/0
                            Description: Allow all outbound traffic
    expectations:
        rules:
            security_group_rules_have_description: PASS
            subnet_no_public_ip: SKIP
            vpc_dns_enabled: SKIP
            security_group_rule_resources_have_description: SKIP
            dms_replication_instance_not_publicly_accessible: SKIP
            vpc_interface_endpoint_private_dns_enabled: SKIP
            dms_endpoint_kms_encryption_required: SKIP

